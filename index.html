<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>1.12 Анимации и переходы</title>
</head>

<body>
    <div class="wrapper">
        <div class="container">

            <div class="buttons">
                <h3>Buttons</h3>
                <div class="buttons__primary">
                    <p>Primary</p>
                    <button class="button__primary">button</button>
                    <button class="button__primary" disabled>button</button>

                </div>
                <div class="buttons__simple">
                    <p>Simple buttons</p>
                    <a class="button__simple" href="#">
                        <span>button -></span>
                    </a>
                </div>
            </div>
            <div class="input__form">
                <h3>Form elements</h3>
                <p>Input Field</p>
                <input class="form__input" type="text" placeholder="Введите текст">
            </div>
        </div>

    </div>
</body>

</html>
